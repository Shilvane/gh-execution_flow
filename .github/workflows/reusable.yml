name: Resuable Deploy
on: 
    workflow_call:
        inputs:
            artifacts_name:
                description: Name of the deployable artifacts files
                required: false
                default: dist
                type: string
    #    secrets:
    #       some_secret:
    #            required: false
        outputs:
            result:
                description: Result of this Workflow
                value: ${{ jobs.deploy.outputs.outcome }}
jobs:
    deploy:
        outputs:
            outcome: ${{ steps.set_output.outputs.something }}
        runs-on: ubuntu-latest
        steps:
            - name: Get Uploaded code
              uses: actions/download-artifact@v4
              with:
                name: ${{ inputs.artifacts_name }}
            - name: Check the code
              run: ls -l
            - name: Output Information
              run: echo "Deploying and Uploading"
            - name: Set result output
              id: set_output
              run: echo "something=success" >> $GITHUB_OUTPUT